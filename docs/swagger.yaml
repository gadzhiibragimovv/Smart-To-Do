basePath: /
definitions:
  handlers.LoginRequest:
    properties:
      email:
        description: Email пользователя
        type: string
      password:
        description: Пароль (не хешированный)
        type: string
    type: object
  handlers.LoginResponse:
    properties:
      access_token:
        description: JWT токен для доступа (24 часа)
        type: string
      refresh_token:
        description: JWT токен для обновления (7 дней)
        type: string
      user:
        allOf:
        - $ref: '#/definitions/handlers.User'
        description: Информация о пользователе из файла user.go
    type: object
  handlers.RefreshRequest:
    properties:
      refresh_token:
        description: Refresh токен
        type: string
    type: object
  handlers.RefreshResponse:
    properties:
      access_token:
        description: Новый JWT токен
        type: string
    type: object
  handlers.Task:
    properties:
      created_at:
        description: CreatedAT - Дата и время создания задачи
        type: string
      description:
        description: Description - Краткое описание задачи
        type: string
      id:
        description: ID - Уникальный индефикатор
        type: integer
      title:
        description: Title - Заголовок задачи
        type: string
      updated_at:
        description: UpdatedAT - Дата и время последнего обновления задачи
        type: string
      user_id:
        description: UserID - Пользователь
        type: integer
    type: object
  handlers.User:
    properties:
      email:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
host: localhost:9090
info:
  contact: {}
  description: API для управления задачами и пользователями
  title: Smart To-Do API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Авторизация по email и паролю
      parameters:
      - description: Email и пароль
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/handlers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.LoginResponse'
        "400":
          description: Неверный JSON
          schema:
            type: string
        "401":
          description: Неверные учетные данные
          schema:
            type: string
        "500":
          description: Ошибка сервера
          schema:
            type: string
      summary: Войти в систему
      tags:
      - auth
  /auth/logout:
    post:
      description: |-
        Удаляет все refresh токены пользователя из БД
        Удаляет все refresh токены...
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Ошибка сервера
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Выйти из системы
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Получить новый access token используя refresh token
      parameters:
      - description: Refresh token
        in: body
        name: token
        required: true
        schema:
          $ref: '#/definitions/handlers.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.RefreshResponse'
        "400":
          description: Неверный JSON
          schema:
            type: string
        "401":
          description: Неверный refresh token
          schema:
            type: string
        "500":
          description: Ошибка сервера
          schema:
            type: string
      summary: Обновить токен
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Создает нового пользователя с хешированным паролем
      parameters:
      - description: Данные пользователя
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/handlers.User'
      produces:
      - application/json
      responses:
        "201":
          description: Пользователь успешно создан
          schema:
            $ref: '#/definitions/handlers.User'
        "400":
          description: Неверный JSON или валидация
          schema:
            type: string
        "409":
          description: Email уже существует
          schema:
            type: string
        "500":
          description: Ошибка сервера
          schema:
            type: string
      summary: Зарегистрировать пользователя
      tags:
      - auth
  /tasks:
    get:
      description: Возвращает все задачи текущего пользователя
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.Task'
            type: array
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Ошибка сервера
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Получить список задач
      tags:
      - tasks
    post:
      consumes:
      - application/json
      description: Создает новую задачу
      parameters:
      - description: Данные задачи
        in: body
        name: task
        required: true
        schema:
          $ref: '#/definitions/handlers.Task'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.Task'
        "400":
          description: Неверный JSON
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Ошибка сервера
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Создать задачу
      tags:
      - tasks
  /tasks/{id}:
    delete:
      description: Удаляет задачу по её идентификатору
      parameters:
      - description: ID задачи
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: ID удалённой задачи
          schema:
            type: integer
        "400":
          description: Неверный ID
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Ошибка сервера
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Удалить задачу
      tags:
      - tasks
    get:
      description: Возвращает задачу текущего пользователя по ID
      parameters:
      - description: ID задачи
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.Task'
        "400":
          description: Неверный ID
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "404":
          description: Задача не найдена
          schema:
            type: string
        "500":
          description: Ошибка сервера
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Получить список задач
      tags:
      - tasks
    put:
      consumes:
      - application/json
      description: Обновляет задачу текущего пользователя по идентификатору
      parameters:
      - description: ID задачи
        in: path
        name: id
        required: true
        type: integer
      - description: Данные задачи
        in: body
        name: task
        required: true
        schema:
          $ref: '#/definitions/handlers.Task'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.Task'
        "400":
          description: Неверные данные запроса
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "404":
          description: Задача не найдена
          schema:
            type: string
        "500":
          description: Ошибка сервера
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Обновить задачу
      tags:
      - tasks
  /users:
    get:
      description: Возвращает профиль авторизованного пользователя
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.User'
        "401":
          description: Unauthorized
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Получить текущего пользователя
      tags:
      - users
  /users/me:
    delete:
      description: Удаляет текущего пользователя и все его задачи (CASCADE)
      responses:
        "200":
          description: ID удалённого пользователя
          schema:
            additionalProperties:
              type: integer
            type: object
        "401":
          description: Unauthorized
          schema:
            type: string
        "404":
          description: Пользователь не найден
          schema:
            type: string
        "500":
          description: Ошибка сервера
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Удалить аккаунт
      tags:
      - users
    get:
      description: Возвращает профиль авторизованного пользователя
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.User'
        "400":
          description: Неверный ID
          schema:
            type: string
        "404":
          description: Пользователь не найдена
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Получить текущего пользователя
      tags:
      - users
    put:
      consumes:
      - application/json
      description: Обновляет профиль авторизованного пользователя
      parameters:
      - description: Данные пользователей
        in: body
        name: task
        required: true
        schema:
          $ref: '#/definitions/handlers.User'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.User'
        "400":
          description: Неверный JSON или ID
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "404":
          description: Пользователь не найден
          schema:
            type: string
        "500":
          description: Ошибка сервера
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Обновить текущего пользователя
      tags:
      - users
swagger: "2.0"
