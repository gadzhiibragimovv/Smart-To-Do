<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Smart To-Do</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --text: #111827;
      --muted: #6b7280;
      --danger: #ef4444;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,.08);
      animation: fadeIn .4s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      margin: 0 0 6px;
      font-size: 24px;
    }

    p {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
      margin-bottom: 12px;
      font-size: 14px;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
    }

    button {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: var(--primary);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s ease;
    }

    button:hover {
      background: var(--primary-hover);
    }

    .tasks {
      margin-top: 20px;
    }

    .task {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: #f9fafb;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .task span {
      font-size: 14px;
    }

    .task button {
      width: auto;
      background: transparent;
      color: var(--danger);
      font-size: 16px;
      padding: 0;
    }

    .logout {
      margin-top: 16px;
      background: #e5e7eb;
      color: #111;
    }

    .logout:hover {
      background: #d1d5db;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

<div class="container">

  <!-- AUTH -->
  <div class="card" id="auth">
    <h1>Smart To-Do</h1>
    <p>Войдите, чтобы управлять задачами</p>

    <input id="email" placeholder="Email" />
    <input id="password" type="password" placeholder="Пароль" />

    <button onclick="login()">Войти</button>
  </div>

  <!-- TASKS -->
  <div class="card hidden" id="app">
    <h1>Мои задачи</h1>
    <p>Что нужно сделать сегодня?</p>

    <input id="title" placeholder="Название задачи" />
    <input id="description" placeholder="Описание (необязательно)" />

    <button onclick="createTask()">Добавить задачу</button>

    <div class="tasks" id="taskList"></div>

    <button class="logout" onclick="logout()">Выйти</button>
  </div>

</div>

<script>
const API = "http://localhost:9090";

const authCard = document.getElementById("auth");
const appCard = document.getElementById("app");

function token() {
  return localStorage.getItem("access_token");
}

if (token()) {
  showApp();
  loadTasks();
}

async function login() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const res = await fetch(`${API}/auth/login`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, password })
  });

  if (!res.ok) {
    alert("Неверный email или пароль");
    return;
  }

  const data = await res.json();
  localStorage.setItem("access_token", data.access_token);

  showApp();
  loadTasks();
}

function showApp() {
  authCard.classList.add("hidden");
  appCard.classList.remove("hidden");
}

async function loadTasks() {
  const res = await fetch(`${API}/tasks`, {
    headers: {
      Authorization: "Bearer " + token()
    }
  });

  const tasks = await res.json();
  const list = document.getElementById("taskList");
  list.innerHTML = "";

  tasks.forEach(t => {
    const div = document.createElement("div");
    div.className = "task";
    div.innerHTML = `
      <span>${t.title}</span>
      <button onclick="deleteTask(${t.id})">✕</button>
    `;
    list.appendChild(div);
  });
}

async function createTask() {
  const title = document.getElementById("title").value;
  const description = document.getElementById("description").value;

  if (!title) return;

  await fetch(`${API}/tasks`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      Authorization: "Bearer " + token()
    },
    body: JSON.stringify({ title, description })
  });

  document.getElementById("title").value = "";
  document.getElementById("description").value = "";

  loadTasks();
}

async function deleteTask(id) {
  await fetch(`${API}/tasks/${id}`, {
    method: "DELETE",
    headers: {
      Authorization: "Bearer " + token()
    }
  });

  loadTasks();
}

function logout() {
  localStorage.removeItem("access_token");
  location.reload();
}
</script>

</body>
</html>
